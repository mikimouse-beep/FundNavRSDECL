name: Run UniCredit daily

on:
  schedule:
    # Vsak dan ob 06:23 UTC (07:23 po slovenskem zimskem času)
    - cron: '0 4 * * *'
  workflow_dispatch:   # omogoča ročni zagon z gumbom "Run workflow"

permissions:
  contents: write

concurrency:
  group: csv-update
  cancel-in-progress: false

jobs:
  unicredit:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repozitorija
        uses: actions/checkout@v5

      - name: Nastavi Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Namesti knjižnice
        run: |
          python -m pip install --upgrade pip
          pip install pandas playwright
          python -m playwright install --with-deps chromium

      - name: Zaženi unicredit.py
        run: python unicredit.py

      - name: Shrani unicredit.csv v GitHub
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add unicredit.csv
          if git diff --cached --quiet; then
            echo "Ni sprememb v unicredit.csv."
          else
            git commit -m "Update unicredit.csv"
            git pull --rebase
            git push
          fi
